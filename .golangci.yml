# Настройка golangci-lint для LACERT. Схема версии 2, линтер от 2.x.
#
# Запуск: golangci-lint run ./...
# Он же вызывается из check-all.sh и из проверок в CI, если найден в PATH.
#
# Здесь включены проверки, которые уже находили в проекте ошибки, и отключены
# те, что расходятся с принятым стилем. Причина каждого решения записана
# рядом с ним.

version: "2"

run:
  tests: true

linters:
  # К набору по умолчанию (errcheck, govet, ineffassign, staticcheck, unused)
  # добавлены:
  enable:
    - gocritic    # нашёл сравнение значения с самим собой в тесте и os.Exit,
                  # из-за которого не отрабатывало отложенное закрытие
                  # соединений
    - revive      # затенение встроенных имён, неиспользуемые параметры
    - misspell    # опечатки в английских комментариях и строках
    - unconvert   # лишние приведения типов
    - unparam     # параметры, которые всегда получают одно значение
    - bodyclose   # незакрытые тела ответов HTTP
    - nilerr      # возврат nil там, где ошибка не пустая
    - gosec       # типовые огрехи безопасности

  settings:
    govet:
      enable-all: true
      disable:
        # Выравнивание полей структур ради экономии байт здесь не цель, а
        # перестановка полей ломает осмысленный порядок в объявлениях.
        - fieldalignment
        # shadow ругается на идиому if err := f(); err != nil внутри функции,
        # где err уже объявлена. Это стиль всего проекта и всей стандартной
        # библиотеки, а не ошибка.
        - shadow
    gocritic:
      enabled-tags:
        - diagnostic
        - style
      disabled-checks:
        # Выбор между nil и http.NoBody в теле запроса на поведение не влияет.
        - httpNoBody
    revive:
      rules:
        - name: redefines-builtin-id
        - name: unused-parameter
    staticcheck:
      checks:
        - all
        # QF1001 предлагает раскрыть !(a && b) по закону де Моргана. В проверке
        # пароля брокера нынешняя запись прямо отвечает комментарию над ней:
        # оба сравнения выполняются всегда, без раннего выхода.
        - -QF1001
    gosec:
      excludes:
        # G404: слабый генератор случайных чисел. В стенде нагрузки и в
        # эмуляторе он даёт разброс задержек и данных телеметрии, к
        # криптографии отношения не имеет — там везде crypto/rand.
        - G404

  exclusions:
    generated: lax
    # Умолчания golangci оставлены включёнными: они гасят отложенные Close и
    # печать в лог, где проверять ошибку нечего и некуда докладывать. Всё, что
    # они прячут, просмотрено вручную при настройке линтера.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Вспомогательные функции тестов намеренно принимают параметры, которые
      # сегодня вызываются с одним значением: алгоритм подписи и таймаут
      # ожидания. Гибкость подписи нужна для будущих проверок вторым
      # алгоритмом, ради линтера её терять не стоит.
      - path: _test\.go
        linters:
          - unparam
      # Тесты сравнивают поведение с прежней схемой представления ключа,
      # поэтому обращаются к устаревшему elliptic.Marshal сознательно.
      - path: internal/crypto/crypto_test\.go
        text: SA1019
      # В тестах допустимы жёстко заданные учётные данные стенда и запуск
      # локальных серверов на произвольном порту.
      - path: _test\.go
        linters:
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
