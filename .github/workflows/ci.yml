name: Проверки

# Те же проверки, что делает check-all.sh локально: сборка, статический анализ,
# линтер, форматирование, тесты, детектор гонок, покрытие, демонстрация и сверка
# документации с кодом. Пропущены только замеры скорости — на общих раннерах
# их числа ничего не значат. Отличие одно — здесь поднимается настоящая
# PostgreSQL, поэтому тесты хранилища не пропускаются, как это происходит на
# машине без базы.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    name: Сборка и тесты
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: lacert
          POSTGRES_DB: lacert
        ports:
          - 5432:5432
        # Без проверки готовности шаги начнутся раньше, чем база примет
        # подключения, и тесты хранилища молча уйдут в пропуск.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      LACERT_TEST_PG_DSN: "host=localhost user=postgres password=lacert dbname=lacert port=5432 sslmode=disable"

    steps:
      - name: Забрать исходники
        uses: actions/checkout@v7

      - name: Поставить Go
        uses: actions/setup-go@v7
        with:
          # Версия берётся из go.mod, чтобы не разъезжалась с проектом.
          go-version-file: go.mod
          cache: true

      - name: Сборка
        run: go build ./...

      - name: Статический анализ
        run: go vet ./...

      - name: Линтер
        # Версия закреплена намеренно: плавающая ставила бы проверки в
        # зависимость от чужого выпуска, и однажды зелёная ветка покраснела бы
        # сама по себе. Настройка в .golangci.yml написана по схеме 2, поэтому
        # линтер нужен второй серии.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout 5m

      - name: Форматирование
        run: |
          # gofmt -l печатает файлы, которые надо переформатировать.
          # Пустой вывод означает, что всё в порядке.
          unformatted="$(gofmt -s -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "Эти файлы не отформатированы:"
            echo "$unformatted"
            exit 1
          fi

      - name: Тесты с покрытием
        run: go test ./... -count=1 -cover

      - name: Детектор гонок данных
        # GOMAXPROCS выставлен шире числа ядер раннера намеренно: гонка в
        # остановке сервера жила с первого выпуска и не ловилась на узком
        # планировщике, а при шестнадцати потоках проявлялась сразу.
        run: GOMAXPROCS=16 go test -race ./internal/... -count=1

      - name: Проверить, что тесты хранилища не пропущены
        run: |
          # Страховка от тихой деградации: если база вдруг окажется
          # недоступна, тесты pgstore пропустятся, проверки останутся
          # зелёными, а хранилище — непроверенным. Ловим это явно.
          out="$(go test ./internal/store/pgstore/ -count=1 -v 2>&1)"
          echo "$out" | tail -20
          if echo "$out" | grep -q "postgres unavailable"; then
            echo "Тесты хранилища пропущены — база недоступна."
            exit 1
          fi

      - name: Демонстрация
        # Сквозной прогон без сети: регистрация, рукопожатие, две атомарные
        # ротации, отправка данных. Ловит поломки, которые модульные тесты
        # обходят стороной, укладывается в секунду.
        run: go run ./cmd/demo > /dev/null

      - name: Сверка документации с кодом и гигиена дерева
        # Девять проверок: переменные окружения, коды кадров, пределы, опорные
        # замеры, числовой паритет локалей, упоминания путей, мусор в дереве,
        # ссылки между документами, учебные упоминания и секреты в коде.
        run: bash check-docs.sh
